name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a Go security release goes red here even when nobody
  # pushes: govulncheck below reads the toolchain that ships.
  schedule:
    - cron: "17 6 * * 1"

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux
      - run: make lint
      - run: make test
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  # Homebrew and the review popup are macOS first; the e2e test has a
  # darwin branch of its own.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: brew install tmux
      - run: make test

  # Static analysis. The jobs above build and test with go.mod's
  # toolchain line, which is what the release builds with too.
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # staticcheck 2026.2.1 cannot read go1.27.2's export data ("export
      # data version 5 is greater than maximum supported version 4"), so
      # it runs on the last Go it can. Back to go-version-file: go.mod with
      # the staticcheck release that reads it.
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
      - run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...

  # govulncheck judges the standard library by the Go it runs on, so it
  # runs on the toolchain the release builds with. A Go security release
  # turns this red; `go get toolchain@patch` and a tag fix it. A job of
  # its own: setup-go reads go.mod's toolchain line only while GOTOOLCHAIN
  # is unset, and an earlier setup-go in the same job sets it to local.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.263 # the release the plugin was validated with
      - run: claude plugin validate ./owl --strict
      - run: claude plugin validate . --strict
      # validate checks the shape; this checks that plugin.json and the
      # marketplace entry carry the same version. --dry-run creates no tag.
      - run: claude plugin tag --dry-run ./owl
